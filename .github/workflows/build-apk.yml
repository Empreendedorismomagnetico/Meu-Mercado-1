
name: Gerar APK - Meu Mercado

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Conferir Expo
        run: npx expo --version

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --info

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Mercado-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
